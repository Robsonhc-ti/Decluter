<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Entrar | Decluter
    </title>
</head>

<body>

    <main>

        <h1>
            Bem-vindo ao Decluter
        </h1>

        <p>
            Entre para organizar seus projetos e estudos.
        </p>

        <form>

            <div>

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                >

            </div>


            <div>

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                >

            </div>


            <button type="submit">

                Entrar

            </button>

        </form>


        <p>

            Ainda não possui uma conta?

            <a href="/cadastro/">

                Criar conta

            </a>

        </p>

    </main>

</body>

</html>
