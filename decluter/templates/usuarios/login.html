{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decluter</title>
    <link rel="stylesheet" href="{% static 'usuarios/style.css' %}">
</head>
<body>

    <main class="login-container">
        
        <!-- Lado Esquerdo: Formulário Dinâmico -->
        <section class="login-form-side">
            <div class="form-wrapper">
                
                <!-- Logo -->
                <div class="logo">
                    <span class="logo-icon"></span>
                    <h1>Decluter</h1>
                </div>

                <!-- Abas de Navegação -->
                <div class="tabs">
                    <button class="tab-btn active" id="tab-entrar">Entrar</button>
                    <button class="tab-btn" id="tab-criar">Criar conta</button>
                </div>

                <!-- Formulário -->
                <form id="auth-form">
                    <!-- Campo Nome (oculto por padrão no modo Entrar) -->
                    <div class="input-group hidden" id="group-name">
                        <label for="name">Nome</label>
                        <input type="text" id="name" placeholder="Seu nome">
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="nome@escola.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="Sua senha" required>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">Entrar</button>
                </form>

                <!-- Rodapé do Formulário Alterável -->
                <div class="form-footer" id="form-footer">
                    <p class="social-login">Ou continue com Google</p>
                </div>

            </div>
        </section>

        <!-- Lado Direito: Ilustração Esquemática -->
        <section class="login-illustration-side">
            <div class="skeleton-card">
                <div class="skeleton-line long"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-line long"></div>
                <div class="skeleton-line short"></div>
            </div>
        </section>

    </main>

    <!-- Script de Interatividade -->
    <script src="{% static 'usuarios/scripts.js' %}"></script>

</body>
</html>
