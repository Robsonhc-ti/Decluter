<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Criar conta | Decluter
    </title>

</head>

<body>

    <main>

        <h1>
            Crie sua conta
        </h1>

        <p>
            Comece a organizar seus projetos e estudos.
        </p>


        <form>

            <div>

                <label for="nome">

                    Nome

                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                >

            </div>


            <div>

                <label for="email">

                    E-mail

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                >

            </div>


            <div>

                <label for="senha">

                    Crie uma senha

                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                >

            </div>


            <div>

                <label for="confirmar-senha">

                    Confirme a senha

                </label>

                <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Digite a senha novamente"
                >

            </div>


            <button type="submit">

                Criar conta

            </button>

        </form>


        <p>

            Já possui uma conta?

            <a href="/login/">

                Entrar

            </a>

        </p>

    </main>

</body>

</html>
